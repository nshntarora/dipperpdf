<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">DipperPDF</title>
  <defs>
    <linearGradient id="tile" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fcfaf2"/>
      <stop offset="1" stop-color="#e3d6c2"/>
    </linearGradient>
    <radialGradient id="body" cx="55%" cy="22%" r="62%">
      <stop stop-color="#ab7d5c"/>
      <stop offset=".55" stop-color="#946342"/>
      <stop offset="1" stop-color="#472e21"/>
    </radialGradient>
    <linearGradient id="bib" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#fcfaf2"/>
      <stop offset="1" stop-color="#d9ccB5"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b88c66"/>
      <stop offset=".55" stop-color="#946342"/>
      <stop offset="1" stop-color="#634533"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#472e21" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="rim" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#472e21" stop-opacity=".06"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#472e21" flood-opacity=".16"/>
    </filter>
    <filter id="bird-shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="1" dy="6" stdDeviation="5" flood-color="#472e21" flood-opacity=".28"/>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tile-clip">
      <rect x="16" y="16" width="224" height="224" rx="46"/>
    </clipPath>
    <path id="bird-body" d="M18 63 8 49Q18 48 28 48C35 36 54 40 56 30 57 15 81 17 81 35c2 2 6 3 8 4q2 1 0 2-4 2-8 3c2 22-4 34-24 34-17 2-33-4-39-15Z"/>
    <path id="bird-bib" d="M76 46c-3-3-12 2-18-1-8 4-12 17-7 23 7 8 18 7 23-1 6-7 6-17 2-21Z"/>
    <path id="bird-wing" d="M27 55c9-13 32-13 31-5q-2 15-21 18-11-2-10-13Z"/>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="46" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <g clip-path="url(#tile-clip)">
    <ellipse cx="83" cy="52" rx="110" ry="72.5" fill="#fff" opacity=".85" filter="url(#soft-glow)"/>
    <ellipse cx="198" cy="218" rx="85" ry="50" fill="#bf9c75" opacity=".15" filter="url(#soft-glow)"/>
    <rect x="16" y="16" width="224" height="224" rx="46" fill="#fff" opacity=".18"/>

    <g transform="translate(-100 3) rotate(-20 170 170) scale(3.4)" filter="url(#bird-shadow)">
      <use href="#bird-body" fill="url(#body)" stroke="url(#edge)" stroke-width=".3"/>
      <use href="#bird-bib" fill="url(#bib)" stroke="url(#edge)" stroke-width=".24"/>
      <use href="#bird-wing" fill="url(#wing)" stroke="url(#edge)" stroke-width=".27"/>
      <g fill="none" stroke="#472e21" stroke-opacity=".22" stroke-width=".65" stroke-linecap="round">
        <path d="M32 57q8-8 20-6"/><path d="M33 61q9-1 17-5"/><path d="M36 65q6-1 10-4"/>
      </g>
      <circle cx="72.75" cy="31.75" r="1.75" fill="#211712" stroke="#946342" stroke-opacity=".6" stroke-width=".3"/>
      <circle cx="72.2" cy="31.1" r=".45" fill="#fff" opacity=".9"/>
    </g>
  </g>
  <rect x="16.75" y="16.75" width="222.5" height="222.5" rx="45.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <rect x="18.75" y="18.75" width="218.5" height="218.5" rx="43.25" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width=".5"/>
</svg>
