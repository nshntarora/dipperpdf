name: macOS tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run unit and PDF integration tests
        env:
          DIPPER_TEST_RESULTS: build/TestResults/DipperPDF.xcresult
        run: ./scripts/test.sh
      - name: Export coverage
        if: success()
        run: xcrun xccov view --report build/TestResults/DipperPDF.xcresult
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/TestResults/*.xcresult
          if-no-files-found: warn
